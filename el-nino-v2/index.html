<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>El Niño V2 — Three-slide Review</title><style>body{margin:0;background:#082d43;color:white;font:16px system-ui}header,footer{padding:12px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px}h1{font-size:1.1rem;margin:0}main{min-height:65dvh;display:grid;place-items:center;padding:8px}img{display:block;max-width:100%;max-height:73dvh;object-fit:contain}button,a{background:#d6eff8;color:#092c43;border:0;border-radius:9px;padding:12px;font-weight:700}a{text-decoration:none}.notice{padding:24px;line-height:1.6;max-width:45rem}footer{justify-content:center}#counter{min-width:75px;text-align:center}</style><header><h1>El Niño · Original Slides</h1><a href="../">Return to Hub</a></header><main id="stage"><div class="notice">Original slides have not yet been uploaded. This preview will not substitute generic diagrams.</div></main><footer><button id="prev">◀ Previous</button><span id="counter">1 / 3</span><button id="next">Next ▶</button></footer><script>const slides=['slide-01.jpg','slide-02.jpg','slide-03.jpg'];let current=0;const stage=document.querySelector('#stage');function render(){const img=new Image();img.alt='Original El Niño presentation slide '+(current+1);img.onload=()=>stage.replaceChildren(img);img.onerror=()=>{stage.innerHTML='<div class="notice"><strong>Original slide '+(current+1)+' is not available.</strong><br>No substitute artwork will be displayed.</div>'};img.src='./images/'+slides[current];document.querySelector('#counter').textContent=(current+1)+' / 3'}document.querySelector('#prev').onclick=()=>{current=(current+2)%3;render()};document.querySelector('#next').onclick=()=>{current=(current+1)%3;render()};document.addEventListener('keydown',e=>{if(e.key==='ArrowRight')document.querySelector('#next').click();if(e.key==='ArrowLeft')document.querySelector('#prev').click()});render();</script></html>
