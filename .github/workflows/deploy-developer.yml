name: Publish orange MBA Hub DEV (canonical AGE)
on:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: developer-pages
  cancel-in-progress: false
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - name: Checkout canonical app source
        uses: actions/checkout@v4
        with:
          repository: drtforshortaol/MBA-hub-v2
          # Immutable reviewed canonical source revision; update only after CI review.
          ref: 78363a6739dbe1b63cac397bf9ac70dfa6b78958
          path: source
          persist-credentials: false
      - name: Checkout deployment workflow for AGE inspection
        uses: actions/checkout@v4
        with:
          path: orange-workflow
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate architecture and build from canonical registry
        working-directory: source
        run: |
          npm run validate
          npm run build
          npm test
          node scripts/age/guard-deployment.mjs ../orange-workflow/.github/workflows/deploy-developer.yml
      - name: Verify El Niño is registered once and its images are integrity-bound
        working-directory: source
        run: |
          node --input-type=module <<'EOF'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          const root='dist/developer/';
          const registry=JSON.parse(fs.readFileSync(root+'registry.json','utf8'));
          const matches=registry.apps.filter(a=>a.app_id==='el-nino');
          assert.equal(matches.length,1,'El Niño must be declared exactly once in canonical registry');
          assert.equal(matches[0].category,'concepts');
          const resources=new Set(JSON.parse(fs.readFileSync(root+'release.json','utf8')).resources.map(r=>r.url));
          for(let i=1;i<=18;i++)assert.ok(resources.has(`apps/el-nino/images/slide-${String(i).padStart(2,'0')}.jpg`));
          const env=JSON.parse(fs.readFileSync(root+'environment.json','utf8'));
          assert.equal(env.namespace,'mba-v2-developer');
          assert.equal(env.developer,true);
          console.log('Canonical orange registry, 18 offline illustrations and namespace: PASS');
          EOF
      # Deliberately no preview copy, code.replace, or core/hub.js mutation.
      # Orange identity/branding must be sourced from a governed environment theme.
      # This workflow is manual-only until visual and device acceptance.
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: source/dist/developer
      - uses: actions/deploy-pages@v4
