name: Publish orange MBA Hub DEV
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/deploy-developer.yml'
      - 'preview/**'
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: developer-pages
  cancel-in-progress: false
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - name: Checkout canonical app source
        uses: actions/checkout@v4
        with:
          repository: drtforshortaol/MBA-hub-v2
          ref: work/device-acceptance-prep-20261030
          path: source
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned parser
        working-directory: source
        run: python -m pip install --requirement scripts/migration/requirements-fidelity.txt
      - name: Build and verify
        working-directory: source
        run: |
          npm run build
          node scripts/audit-privacy-snapshot.mjs --write-reviewed-binding
          npm test
          npm run security:scan
          node scripts/verify-build-artifacts.mjs
      - name: Verify DEV identity
        working-directory: source
        run: |
          node --input-type=module <<'EOF'
          import fs from 'node:fs';
          const m=JSON.parse(fs.readFileSync('dist/developer/manifest.webmanifest'));
          const e=JSON.parse(fs.readFileSync('dist/developer/environment.json'));
          if(m.name!=='MBA Hub DEV'||!e.developer||e.namespace!=='mba-v2-developer') throw Error('Wrong channel');
          if(!fs.readFileSync('dist/developer/icon.svg','utf8').includes('#d66b12')) throw Error('Orange icon missing');
          if(!fs.readFileSync('dist/developer/core/hub.js','utf8').includes('toggleDeveloper')) throw Error('Five-tap activation missing');
          EOF
      - name: Prepare orange Developer installation identity and direct QR
        run: |
          python -m pip install 'qrcode[pil]==8.2'
          python - <<'PY'
          from pathlib import Path
          import qrcode
          url='https://drtforshortaol.github.io/MBA-hub-v2-dev/'
          install=Path('source/src/install.html')
          text=install.read_text()
          text=text.replace('MBA Hub V2 | Install &amp; Help','MBA Hub DEV | Install &amp; Help')
          text=text.replace('Blue MBA Hub V2 Guide address','Orange MBA Hub DEV installation address')
          text=text.replace('Open Guide','Open Developer')
          text=text.replace('MBA Hub V2 Guide installation link','MBA Hub DEV installation link')
          text=text.replace('Open the blue Hub icon','Open the orange DEV icon')
          text=text.replace('universal Guide link','universal Developer link')
          text=text.replace('Step-by-step instructions for volunteers','Step-by-step instructions for the owner')
          text=text.replace('Blue MBA Hub V2 Guide','Orange MBA Hub DEV')
          text=text.replace('Guide evaluation version.','Owner Developer version.')
          text=text.replace('Keep MBA Hub V1 available as a backup. Install V2 once; subsequent updates normally do not require reinstallation.','Keep the blue Guide installed separately. Developer updates normally do not require reinstallation.')
          text=text.replace('The same Guide link and QR code work on iPhone, Android, Windows, and Mac.','The same Developer link and QR code work on iPhone, Android, Windows, and Mac.')
          text=text.replace('https://drtforshortaol.github.io/MBA-hub-v2/','https://drtforshortaol.github.io/MBA-hub-v2-dev/')
          text=text.replace('Return to MBA Hub V2','Return to MBA Hub DEV')
          text=text.replace('MBA Hub Version 2 — installation and assistance','MBA Hub DEV — installation and assistance')
          text=text.replace('Guide evaluation version','Developer version')
          text=text.replace('#123e50','#a64b0b').replace('#11607b','#a64b0b')
          install.write_text(text)
          qr=qrcode.QRCode(border=4,box_size=10,error_correction=qrcode.constants.ERROR_CORRECT_M)
          qr.add_data(url,optimize=0)
          qr.make(fit=True)
          qr.make_image(fill_color='black',back_color='white').save('source/src/install-qr.png')
          css=Path('source/src/core/hub.css')
          css.write_text(css.read_text()+"""
          /* Developer-only orange identity. Applied before release hashing. */
          body:has(#title) header { background: #a64b0b; border-bottom-color: #f0ae43; }
          body:has(#title) header p { color: #fff0dc; }
          body:has(#title) #title small { color: #ffe0a0; }
          body:has(#title) .search-icon { background: #c46a19; }
          body:has(#title) .statusline { color: #ffe0a0; }
          body:has(#title) .open-app, body:has(#title) .button { background: #fff0d9; color: #753700; }
          body:has(#title) #developer { border-top-color: #f0ae43; }
          """)
          PY
      - name: Build integrity-bound orange Developer distribution
        working-directory: source
        run: |
          npm run build
          node scripts/verify-build-artifacts.mjs
          node --input-type=module <<'EOF'
          import fs from 'node:fs';
          const root='dist/developer/';
          const manifest=JSON.parse(fs.readFileSync(root+'manifest.webmanifest'));
          const env=JSON.parse(fs.readFileSync(root+'environment.json'));
          const help=fs.readFileSync(root+'install.html','utf8');
          const css=fs.readFileSync(root+'core/hub.css','utf8');
          const hub=fs.readFileSync(root+'core/hub.js','utf8');
          if(manifest.name!=='MBA Hub DEV'||!env.developer||env.namespace!=='mba-v2-developer')throw Error('Developer identity mismatch');
          if(!help.includes('https://drtforshortaol.github.io/MBA-hub-v2-dev/')||!help.includes('id="copy-guide-url"'))throw Error('Developer copy link missing');
          if(help.includes('https://drtforshortaol.github.io/MBA-hub-v2/'))throw Error('Guide URL leaked into developer help');
          if(help.includes('Open Guide')||help.includes('Blue MBA')||help.includes('blue Hub icon'))throw Error('Stale Guide branding in Developer help');
          if(!help.includes('Open Developer')||!help.includes('Orange MBA Hub DEV installation address'))throw Error('Developer labels missing');
          if(!fs.readFileSync(root+'core/developer.js','utf8').includes('Update check complete.'))throw Error('Visible update feedback missing');
          if(!css.includes('#a64b0b')||!hub.includes('toggleDeveloper'))throw Error('Orange / five-tap behavior changed');
          EOF
      - name: Check out preview uploads
        uses: actions/checkout@v4
        with:
          path: preview-uploads
      - name: Publish El Niño V2 placeholder preview and available original images
        run: |
          if test -s preview-uploads/preview/El_Nino_iPhone_Review.html; then
            mkdir -p source/dist/developer/el-nino-preview
            cp preview-uploads/preview/El_Nino_iPhone_Review.html source/dist/developer/el-nino-preview/index.html
            grep -q 'El Niño' source/dist/developer/el-nino-preview/index.html
            if test -d preview-uploads/preview/images; then
              mkdir -p source/dist/developer/el-nino-preview/images
              cp preview-uploads/preview/images/* source/dist/developer/el-nino-preview/images/
            fi
            echo 'El Niño V2 preview staged with available original images.'
          else
            echo 'Original illustration HTML not uploaded yet; omitting misleading generic preview.'
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: source/dist/developer
      - uses: actions/deploy-pages@v4
