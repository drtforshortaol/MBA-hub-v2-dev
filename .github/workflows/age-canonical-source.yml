name: AGE canonical orange source validation
# Verifies the canonical source, branded orange package, and immutable app registry.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/age-canonical-source.yml'
      - '.github/workflows/deploy-developer.yml'
permissions:
  contents: read
jobs:
  validate-canonical:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout canonical MBA Hub V2 source
        uses: actions/checkout@v4
        with:
          repository: drtforshortaol/MBA-hub-v2
          ref: e3ec2bef5820e0703f43c2d9a1d1a498dcc27726
          path: source
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate AGE and app manifests
        working-directory: source
        run: |
          npm run validate
          npm run build
          npm test
      - name: Assert El Niño comes from the canonical registry and offline bundle
        working-directory: source
        run: |
          node --input-type=module <<'EOF'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          const root='dist/developer/';
          const registry=JSON.parse(fs.readFileSync(root+'registry.json','utf8'));
          const app=registry.apps.filter(a=>a.app_id==='el-nino');
          assert.equal(app.length,1,'El Niño must have exactly one canonical registry entry');
          assert.equal(app[0].category,'concepts');
          const dining=registry.apps.filter(a=>a.app_id==='nearby-dining');
          assert.equal(dining.length,1,'Nearby Dining must remain listed exactly once');
          assert.equal(dining[0].category,'volunteer-tools');
          assert.ok(fs.existsSync(root+'apps/nearby-dining/index.html'));
          const manifest=JSON.parse(fs.readFileSync(root+'manifest.webmanifest','utf8'));
          assert.equal(manifest.name,'MBA Hub DEV');
          assert.equal(manifest.theme_color,'#a64b0b');
          const install=fs.readFileSync(root+'install.html','utf8');
          assert.ok(install.includes('MBA-hub-v2-dev%2F'),'Orange QR URL must be correct');
          assert.ok(!install.includes('MBA-hub-v2-test%2F'),'Old tester QR URL leaked into orange');
          const release=JSON.parse(fs.readFileSync(root+'release.json','utf8'));
          const resources=new Set(release.resources.map(r=>r.url));
          assert.ok(resources.has('apps/el-nino/index.html'));
          for(let i=1;i<=18;i++)assert.ok(resources.has(`apps/el-nino/images/slide-${String(i).padStart(2,'0')}.jpg`));
          console.log('Canonical El Niño and 18 offline images: PASS');
          EOF
      - name: Checkout orange workflow for source inspection
        uses: actions/checkout@v4
        with:
          path: orange-workflow
      - name: Assert validation and deployment use identical canonical source revision
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          root=Path('orange-workflow/.github/workflows')
          def pinned(name):
            text=(root/name).read_text()
            refs=re.findall(r'^\s+ref: ([0-9a-f]{40})\s*
        working-directory: source
        run: node scripts/age/guard-deployment.mjs ../orange-workflow/.github/workflows/age-canonical-source.yml ../orange-workflow/.github/workflows/deploy-developer.yml
,text,re.M)
            if len(refs)!=1: raise SystemExit(f'{name}: expected one pinned canonical source revision, got {refs!r}')
            return refs[0]
          assert pinned('deploy-developer.yml')==pinned('age-canonical-source.yml'),'Release and test revisions differ'
          print('Immutable canonical source revision parity: PASS')
          PY
      - name: Enforce manual-only orange release and no preview injection
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          content=Path('orange-workflow/.github/workflows/deploy-developer.yml').read_text()
          events=content.split('permissions:',1)[0]
          if not re.search(r'^  workflow_dispatch:\s*
        working-directory: source
        run: node scripts/age/guard-deployment.mjs ../orange-workflow/.github/workflows/age-canonical-source.yml ../orange-workflow/.github/workflows/deploy-developer.yml
,events,re.M):
            raise SystemExit('Orange publication must require workflow_dispatch')
          for event in ('push','pull_request','schedule','workflow_run'):
            if re.search(r'^  '+event+r':',events,re.M):
              raise SystemExit(f'Automatic publication trigger prohibited: {event}')
          for prohibited in ('preview-uploads','el-nino-preview','hub.write_text(code)','code=code.replace('):
            if prohibited in content:
              raise SystemExit(f'Deployment source injection prohibited: {prohibited}')
          print('Orange publication safety: manual-only, canonical content, no injection: PASS')
          PY
      - name: Validate no application injection in this workflow
        working-directory: source
        run: node scripts/age/guard-deployment.mjs ../orange-workflow/.github/workflows/age-canonical-source.yml ../orange-workflow/.github/workflows/deploy-developer.yml
